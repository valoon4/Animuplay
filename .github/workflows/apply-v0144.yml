name: Apply and Build v0.14.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-v0144.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v0.14.4 hierarchical back navigation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('app/src/main/java/de/minimal/musicplayer/MainActivity.java')
          text = main_path.read_text(encoding='utf-8')
          start = text.index('    private void handleBack() {')
          end = text.index('    private void playCurrentListRandomly()', start)
          replacement = '''    private void handleBack() {
              if (infoSettingsOpen) {
                  infoSettingsOpen = false;
                  selectTab(MODE_OTHER);
              } else if (playerOpen) {
                  playerOpen = false;
                  playerPanel.setVisibility(View.GONE);
                  libraryList.setVisibility(View.VISIBLE);
                  selectTab(libraryMode);
              } else if (playlistDetailOpen) {
                  openPlaylistBrowser();
              } else if (playlistBrowserOpen) {
                  selectTab(MODE_OTHER);
                  refreshInsets();
              } else if (rlYearDetailOpen) {
                  ArrayList<Song> rlSnapshot = new ArrayList<>(rlSongsForBrowser);
                  resetGroupSearchUi();
                  rlYearBrowserOpen = true;
                  rlYearDetailOpen = false;
                  openRlYearBrowser(rlSnapshot);
              } else if (rlYearBrowserOpen) {
                  resetGroupSearchUi();
                  selectTab(MODE_YEARS);
                  refreshInsets();
              } else if (groupOpen) {
                  resetGroupSearchUi();
                  selectTab(libraryMode);
                  refreshInsets();
              } else if (!TextUtils.isEmpty(searchQuery)) {
                  if (searchInput != null) searchInput.setText(\"\");
                  searchQuery = \"\";
                  hideSearchKeyboard();
                  selectTab(libraryMode);
                  refreshInsets();
              } else if (libraryMode == MODE_GENRES && \"RL\".equals(seasonCategory)) {
                  setSeasonCategory(\"ANIME\");
                  refreshInsets();
              }
          }

          @Override
          public void onBackPressed() {
              boolean hasInternalBackTarget = infoSettingsOpen
                      || playerOpen
                      || playlistDetailOpen
                      || playlistBrowserOpen
                      || rlYearDetailOpen
                      || rlYearBrowserOpen
                      || groupOpen
                      || !TextUtils.isEmpty(searchQuery)
                      || (libraryMode == MODE_GENRES && \"RL\".equals(seasonCategory));
              if (hasInternalBackTarget) handleBack();
              else super.onBackPressed();
          }

'''
          main_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          gradle_path = Path('app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          gradle = gradle.replace('versionCode 21', 'versionCode 22')
          gradle = gradle.replace("versionName '0.14.3-debug'", "versionName '0.14.4-debug'")
          if "versionCode 22" not in gradle or "versionName '0.14.4-debug'" not in gradle:
              raise SystemExit('Version bump failed')
          gradle_path.write_text(gradle, encoding='utf-8')

          workflow_path = Path('.github/workflows/build-debug-apk.yml')
          workflow = workflow_path.read_text(encoding='utf-8').replace('v0.14.3', 'v0.14.4')
          workflow_path.write_text(workflow, encoding='utf-8')
          PY

          grep -n "versionCode 22\|versionName '0.14.4-debug'" app/build.gradle
          grep -n "hasInternalBackTarget\|setSeasonCategory(\"ANIME\")" app/src/main/java/de/minimal/musicplayer/MainActivity.java

      - name: Persist v0.14.4 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/minimal/musicplayer/MainActivity.java app/build.gradle .github/workflows/build-debug-apk.yml
          git commit -m "Implement v0.14.4 hierarchical back navigation"
          git push origin HEAD:main

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.11.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-report.txt
          ACTUAL_CERT_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' apksigner-report.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MinimalMusicPlayer-v0.14.4-debug.apk
          sha256sum dist/MinimalMusicPlayer-v0.14.4-debug.apk > dist/MinimalMusicPlayer-v0.14.4-debug.apk.sha256
          cp apksigner-report.txt dist/apksigner-report.txt
          {
            echo "MinimalMusicPlayer v0.14.4 debug"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Back navigation: hierarchical detail-to-parent behavior"
            echo "Signing cert SHA-256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227"
          } > dist/build-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalMusicPlayer-v0.14.4-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
