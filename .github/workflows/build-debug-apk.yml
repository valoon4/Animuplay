name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-debug-apk:
    name: Build v0.12 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # Install the exact Gradle version directly on the GitHub runner.
      # The project also contains gradlew/gradle-wrapper for Android Studio/local builds,
      # but CI does not rely on an already-populated local Gradle cache.
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        shell: bash
        run: gradle clean assembleDebug --stacktrace

      - name: Verify APK and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-report.txt

          ACTUAL_CERT_SHA256="$($APKSIGNER verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate mismatch" >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MinimalMusicPlayer-v0.12-debug.apk
          sha256sum dist/MinimalMusicPlayer-v0.12-debug.apk > dist/MinimalMusicPlayer-v0.12-debug.apk.sha256
          cp apksigner-report.txt dist/apksigner-report.txt
          {
            echo "MinimalMusicPlayer v0.12 debug"
            echo "Git commit: $GITHUB_SHA"
            echo "Gradle: 8.11.1"
            echo "AGP: 8.9.1"
            echo "compileSdk: 35"
            echo "build-tools: 35.0.0"
            echo "Signing cert SHA-256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227"
          } > dist/build-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalMusicPlayer-v0.12-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
