name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build v0.12.1 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # One-time source migration: wire the new raw YearTagReader into the existing
      # metadata scan without otherwise touching MainActivity.
      - name: Apply year metadata source fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/de/minimal/musicplayer/MainActivity.java')
          text = path.read_text(encoding='utf-8')
          old = '''            String year = valueOr(retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_YEAR),
                              "Unbekannt");'''
          new = '''            String rawYear = YearTagReader.readYear(getContentResolver(), audio.uri, audio.fileName);
              String androidYear = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_YEAR);
              String year = valueOr(rawYear, valueOr(androidYear, "Unbekannt"));'''

          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              print('Patched MainActivity year metadata extraction.')
          elif 'YearTagReader.readYear(getContentResolver(), audio.uri, audio.fileName)' in text:
              print('MainActivity already contains the year metadata fix.')
          else:
              raise SystemExit('Could not locate expected Year extraction code in MainActivity.java')
          PY

      - name: Persist source fix in repository
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- app/src/main/java/de/minimal/musicplayer/MainActivity.java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/de/minimal/musicplayer/MainActivity.java
            git commit -m "Use raw MP3/FLAC year metadata reader [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.11.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-report.txt

          ACTUAL_CERT_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' apksigner-report.txt \
            | head -n 1 \
            | tr '[:upper:]' '[:lower:]' \
            | tr -d ':[:space:]')"

          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate mismatch" >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/MinimalMusicPlayer-v0.12.1-debug.apk
          sha256sum dist/MinimalMusicPlayer-v0.12.1-debug.apk > dist/MinimalMusicPlayer-v0.12.1-debug.apk.sha256
          cp apksigner-report.txt dist/apksigner-report.txt
          {
            echo "MinimalMusicPlayer v0.12.1 debug"
            echo "Git commit: $(git rev-parse HEAD)"
            echo "Gradle: 8.11.1"
            echo "AGP: 8.9.1"
            echo "compileSdk: 35"
            echo "build-tools: 35.0.0"
            echo "Signing cert SHA-256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227"
          } > dist/build-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MinimalMusicPlayer-v0.12.1-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
