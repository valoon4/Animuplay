name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build v0.14.9 Animuplay Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply v0.14.9 playlist checker
        shell: bash
        run: python3 scripts/apply_v0149_playlist_check.py

      - name: Persist v0.14.9 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/de/minimal/musicplayer/MainActivity.java \
                  app/src/main/java/de/minimal/musicplayer/PlaylistIndex.java \
                  app/src/main/res/layout/activity_main.xml \
                  app/build.gradle README.md
          if ! git diff --cached --quiet; then
            git commit -m "Add persistent playlist verification in v0.14.9 [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 / API 36 build components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.11.1
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_VERSION="8.11.1"
          curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -o /tmp/gradle.zip
          sudo mkdir -p /opt/gradle
          sudo unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        shell: bash
        run: gradle clean assembleDebug --stacktrace --no-daemon

      - name: Verify APK and signing certificate
        shell: bash
        env:
          EXPECTED_CERT_SHA256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee apksigner-report.txt
          ACTUAL_CERT_SHA256="$(sed -n 's/^.*certificate SHA-256 digest: //p' apksigner-report.txt | head -n 1 | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          if [ "$ACTUAL_CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Signing certificate mismatch" >&2
            echo "Expected: $EXPECTED_CERT_SHA256" >&2
            echo "Actual:   $ACTUAL_CERT_SHA256" >&2
            exit 1
          fi

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Animuplay-v0.14.9-debug.apk
          sha256sum dist/Animuplay-v0.14.9-debug.apk > dist/Animuplay-v0.14.9-debug.apk.sha256
          cp apksigner-report.txt dist/apksigner-report.txt
          {
            echo "Animuplay v0.14.9 debug"
            echo "Git commit: $GITHUB_SHA"
            echo "Feature: Playlists prüfen diagnostic screen"
            echo "Verification: successful playlist checks persist until playlist content changes"
            echo "Info: VERSION_NAME is shown automatically in Infos & Einstellungen"
            echo "Developer: Eugen / @valoon4"
            echo "Development: AI-assisted coding"
            echo "Support: valoon@protonmail.com"
            echo "Issues: valoon4/Animuplay"
            echo "Package ID remains: de.minimal.musicplayer"
            echo "Gradle: 8.11.1"
            echo "AGP: 8.9.1"
            echo "compileSdk: 36"
            echo "targetSdk: 36"
            echo "build-tools: 36.0.0"
            echo "Signing cert SHA-256: 63df019bdb5fbd06dee0cc7910cc81ed908dcd2d9ae9cfd8cc6e1d1c34404227"
          } > dist/build-info.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Animuplay-v0.14.9-debug
          path: dist/
          if-no-files-found: error
          retention-days: 30
